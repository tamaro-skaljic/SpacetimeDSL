name: Test and Release SpacetimeDSL

on:
  push:
    branches: [ main, develop ]
    tags: [ 'v*' ]  # Trigger release on version tags
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: wasm32-unknown-unknown

    - name: Cache cargo dependencies
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry/index/
          ~/.cargo/registry/cache/
          ~/.cargo/git/db/
          target/
        key: cargo-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          cargo-

    - name: Install SpacetimeDB CLI
      run: |
        # Install SpacetimeDB CLI with non-interactive approach using --yes flag
        curl -sSf https://install.spacetimedb.com | sh -s -- --yes
        
        # Add the correct path based on installation message
        echo "$HOME/.local/bin" >> $GITHUB_PATH
        
        # Verify installation worked
        ls -la "$HOME/.local/bin/" || echo "Local bin directory not found"

    - name: Build & test SpacetimeDSL
      run: |

        spacetime start &

        cd example

        echo "Waiting for SpacetimeDB to be started using a 2s sleep for now."
        sleep 2
        
        echo "Building and publishing a module using SpacetimeDSL..."
        spacetime publish spacetimedsl --yes || echo "Publish failed"
        
        echo "Testing the module..."
        spacetime call spacetimedsl tester --yes || echo "Test call failed"
        
        echo "Showing logs..."
        spacetime logs spacetimedsl --yes || echo "Logs failed"
        
        echo "Cleaning up module..."
        spacetime delete spacetimedsl --yes || echo "Delete failed"

    - name: Check code formatting
      run: |
        cargo fmt --all -- --check

    - name: Run clippy on derive libraries
      run: |
        cd derive-input
        cargo clippy --all-targets --all-features || echo "Clippy warnings in derive-input"
        
        cd ../derive
        cargo clippy --all-targets --all-features || echo "Clippy warnings in derive"
        
        cd ..
        cargo clippy --all-targets --all-features || echo "Clippy warnings in main lib"

  # Release job - publishes to crates.io when pushing version tags
  release:
    name: Release to crates.io
    runs-on: ubuntu-latest
    # Only run on version tags, not on regular pushes
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    # Run after tests pass
    needs: test
    # Use GitHub environment for enhanced security (optional but recommended)
    environment: release
    permissions:
      id-token: write  # Required for OIDC token exchange with crates.io
      contents: read   # Required to read repository contents

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable

    - name: Cache cargo dependencies
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry/index/
          ~/.cargo/registry/cache/
          ~/.cargo/git/db/
          target/
        key: cargo-release-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          cargo-release-
          cargo-

    # Authenticate with crates.io using OIDC/Trusted Publishing
    - name: Authenticate with crates.io
      id: auth
      uses: rust-lang/crates-io-auth-action@v1

    - name: cargo publish --dry-run for every crate to ensure everything is ready
      run: |
        cd derive-input
        cargo publish --dry-run
        cd ../derive
        cargo publish --dry-run
        cd ..
        cargo publish --dry-run

    # Publish derive-input crate first (no dependencies)
    - name: Publish spacetimedsl_derive-input to crates.io
      run: |
        echo "Publishing spacetimedsl_derive-input..."
        cd derive-input
        cargo publish
        echo "✅ spacetimedsl_derive-input published successfully"
        cd ..
      env:
        CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

    # Verify derive-input crate is available before proceeding
    - name: Verify spacetimedsl_derive-input availability
      uses: ./.github/actions/verify-crate-availability
      with:
        crate-name: spacetimedsl_derive-input

    # Publish derive crate second (depends on derive-input)
    - name: Publish spacetimedsl_derive to crates.io
      run: |
        echo "Publishing spacetimedsl_derive..."
        cd derive
        cargo publish
        echo "✅ spacetimedsl_derive published successfully"
        cd ..
      env:
        CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

    # Verify derive crate is available before proceeding
    - name: Verify spacetimedsl_derive availability
      uses: ./.github/actions/verify-crate-availability
      with:
        crate-name: spacetimedsl_derive

    # Publish main crate last (depends on derive)
    - name: Publish spacetimedsl to crates.io
      run: |
        echo "Publishing spacetimedsl (main crate)..."
        cargo publish
        echo "✅ All crates published successfully! 🎉"
      env:
        CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
