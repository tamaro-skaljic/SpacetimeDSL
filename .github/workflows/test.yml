name: Test SpacetimeDSL

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    services:
      spacetimedb:
        image: clockworklabs/spacetime:latest
        ports:
          - 3000:3000
        options: >-
          --health-cmd "curl -f http://localhost:3000/health || exit 1"
          --health-interval 30s
          --health-timeout 10s
          --health-retries 5

    steps:
    - uses: actions/checkout@v4

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: wasm32-unknown-unknown

    - name: Cache cargo dependencies
      uses: actions/cache@v3
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

    - name: Install SpacetimeDB CLI
      run: |
        curl -L https://spacetimedb.com/install.sh | bash
        echo "$HOME/.spacetime/bin" >> $GITHUB_PATH

    - name: Wait for SpacetimeDB to be ready
      run: |
        timeout 60s bash -c 'until curl -f http://localhost:3000/health; do sleep 2; done'

    - name: Build derive libraries
      run: |
        echo "Building derive-input library..."
        cd derive-input
        cargo build --verbose
        
        echo "Building derive library..."
        cd ../derive
        cargo build --verbose
        
        echo "Building main library..."
        cd ..
        cargo build --verbose

    - name: Test derive libraries
      run: |
        echo "Testing derive-input library..."
        cd derive-input
        cargo test --verbose
        
        echo "Testing derive library..."
        cd ../derive  
        cargo test --verbose
        
        echo "Testing main library..."
        cd ..
        cargo test --verbose

    - name: Build example (allow failure for now)
      run: |
        cd example
        echo "Attempting to build example..."
        cargo build --verbose || echo "Example build failed - this is a known issue"

    - name: Try SpacetimeDB integration (if example builds)
      run: |
        cd example
        
        if cargo build --verbose; then
          echo "Example built successfully, testing SpacetimeDB integration..."
          
          echo "Building and publishing module..."
          spacetime publish spacetimedsl --host http://localhost:3000 || echo "Publish failed"
          
          echo "Testing module..."
          spacetime call spacetimedsl tester --host http://localhost:3000 || echo "Test call failed"
          
          echo "Showing logs..."
          spacetime logs spacetimedsl --host http://localhost:3000 || echo "Logs failed"
          
          echo "Cleaning up module..."
          spacetime delete spacetimedsl --host http://localhost:3000 --yes || echo "Delete failed"
        else
          echo "Example failed to build, skipping SpacetimeDB integration test"
        fi

    - name: Check code formatting
      run: |
        cargo fmt --all -- --check

    - name: Run clippy on derive libraries
      run: |
        cd derive-input
        cargo clippy --all-targets --all-features || echo "Clippy warnings in derive-input (allowed for now)"
        
        cd ../derive
        cargo clippy --all-targets --all-features || echo "Clippy warnings in derive (allowed for now)"
        
        cd ..
        cargo clippy --all-targets --all-features || echo "Clippy warnings in main lib (allowed for now)"