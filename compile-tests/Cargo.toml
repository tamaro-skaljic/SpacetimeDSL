[package]
name = "spacetimedsl_compile_tests"
version = "0.22.0"
edition = "2024"
description = "Compile tests which pin the diagnostics SpacetimeDSL emits for invalid table definitions. Not published - it exists only to be tested."
publish = false

[dependencies]
# https://crates.io/crates/spacetimedb Easy support for interacting between SpacetimeDB and Rust.
spacetimedb = { version = "2.7.0", features = ["unstable"] }

# https://crates.io/crates/spacetimedsl The SpacetimeDB Rust Server Module meta-framework
spacetimedsl = { version = "0.22.0", path = ".." }

[dev-dependencies]
# https://crates.io/crates/trybuild Test harness for ui tests of compiler diagnostics
trybuild = { version = "=1.0.121", features = [] }

